name: Boost APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Boost APK

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Grant Gradle Execute Permission
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --info 2>&1 | tee build.log

      - name: List APK output (debug)
        run: find app/build/outputs -type f 2>/dev/null || echo "No output folder found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boost-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
